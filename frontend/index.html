<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src http://127.0.0.1:5000">
  <title>Filomino Puzzle</title>
  <link rel="stylesheet" href="styles.css">
  <script src="renderer.js" defer></script>
</head>

<body>
  <div class="container">
    <h1>Filomino</h1>

    <div class="controls">
      <label>Size
        <select id="sizeSelect">
          <option value="8" selected>8 × 8</option>
          <option value="12">12 × 12</option>
          <option value="16">16 × 16</option>
          <option value="20">20 × 20</option>
        </select>
      </label>
      <label>Difficulty
        <select id="difficultySelect">
          <option value="easy">Easy</option>
          <option value="medium" selected>Medium</option>
          <option value="hard">Hard</option>
        </select>
      </label>
      <button id="newPuzzleBtn">New Puzzle</button>
    </div>

    <p class="hint">Click a cell, then press 1–9 to fill it. Press 0 or Backspace — or click the selected cell again — to clear. Right-click a group to change its color.</p>

    <div id="boardWrap">
      <div id="board"></div>
      <div id="overlay"><span>Generating puzzle…</span></div>
    </div>

    <p id="status"></p>
  </div>
</body>

</html>
